name: Check PolyDaemon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: python -m pip install -r tg-bot/requirements.txt
      - run: python ci/check.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest clients.test_polydaemon_windows clients.test_launch_ws_windows
      - run: node hooks/tg-bridge-locate.test.js
      - run: bun test --timeout 20000 clients/mimo.test.ts clients/mimo-status.test.ts
      - run: bun test clients/opencode-entry.test.ts
      - run: bun test clients/claude-sidebar.test.ts clients/claude-status.test.ts
      - run: python -m unittest discover -s hooks -p test_claude_sidebar.py
